[package]
name = "nod-collector"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Recibe y guarda eventos Nod v1, calcula métricas por tarea y da los límites de uso para tmux"

[lib]
name = "nod_collector"
path = "src/lib.rs"

[[bin]]
name = "nod-collector"
path = "src/main.rs"

[dependencies]
# bundled: SQLite va dentro del binario (con JSON y funciones de ventana), sin depender del del sistema.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
